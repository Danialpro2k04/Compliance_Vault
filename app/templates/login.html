<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComplianceVault — Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <h1>ComplianceVault</h1>
            <p class="subtitle">TradeGuard Governance & Audit Dashboard</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            <div id="loginError" class="error-msg" style="display: none;"></div>
        </form>

        <div class="demo-credentials">
            <h4>Demo Credentials</h4>
            <table class="credentials-table">
                <tr>
                    <th>Role</th>
                    <th>Username</th>
                    <th>Password</th>
                </tr>
                <tr>
                    <td><span class="role-badge role-admin">Admin</span></td>
                    <td>danyal</td>
                    <td>admin123</td>
                </tr>
                <tr>
                    <td><span class="role-badge role-officer">Officer</span></td>
                    <td>sarah</td>
                    <td>officer123</td>
                </tr>
                <tr>
                    <td><span class="role-badge role-operator">Operator</span></td>
                    <td>ali</td>
                    <td>operator123</td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const data = await response.json();
                    errorDiv.textContent = data.detail || 'Login failed';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
